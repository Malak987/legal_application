name: CI

# Verifies the Flutter application and the Supabase Edge Function test suite on
# every push and pull request. These are the checks that cannot be executed in
# the sandboxed workspace (no Flutter SDK / Deno available locally).

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Run tests
        run: flutter test --reporter expanded

  edge-functions:
    name: Edge Function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run delete-my-account test suite
        working-directory: supabase/functions/delete-my-account
        run: deno test --allow-read --allow-env account_deletion_test.ts

      - name: Type-check the Edge Function entrypoint
        working-directory: supabase/functions/delete-my-account
        run: deno check index.ts account_deletion.ts

  bundle-drift:
    name: Edge Function bundle is in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate bundle and fail on drift
        run: |
          python3 supabase/functions/delete-my-account/bundle.py
          git diff --exit-code -- supabase/functions/delete-my-account/dist/index.ts
