name: Diagnose

# TEMPORARY diagnostic workflow.
# The sandbox cannot download GitHub Actions log archives, so this job runs the
# same commands as ci.yml and posts their output as a pull-request comment,
# which is readable through the GitHub API. Delete once CI is green.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: Capture analyze / test / deno output
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version 2>&1 | tee /tmp/flutter-version.txt

      - name: pub get
        run: flutter pub get 2>&1 | tail -20 | tee /tmp/pubget.txt

      - name: analyze
        id: analyze
        run: |
          set +e
          flutter analyze --fatal-infos > /tmp/analyze.txt 2>&1
          echo "analyze_exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          tail -120 /tmp/analyze.txt

      - name: format check
        id: format
        run: |
          set +e
          dart format --output=none --set-exit-if-changed lib test tool > /tmp/format.txt 2>&1
          echo "format_exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          head -60 /tmp/format.txt

      - name: test
        id: test
        run: |
          set +e
          flutter test --reporter compact 2>&1 | tail -25 > /tmp/test.txt
          echo "test_exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          tail -80 /tmp/test.txt

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno test
        id: deno
        working-directory: supabase/functions/delete-my-account
        run: |
          set +e
          deno test --allow-read --allow-env account_deletion_test.ts > /tmp/deno.txt 2>&1
          echo "deno_exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat /tmp/deno.txt

      - name: Post results as a PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return '(missing)'; } };
            const clip = (s, n) => (s.length > n ? s.slice(0, n) + '\n... [truncated]' : s);
            const repo = context.repo;
            const branch = process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME;
            const prs = await github.rest.pulls.list({ ...repo, head: `${repo.owner}:${branch}`, state: 'open' });
            if (!prs.data.length) { core.info('no open PR for branch ' + branch); return; }
            const issue_number = prs.data[0].number;
            const body = [
              '## CI diagnostic (commit ' + context.sha.slice(0, 7) + ')',
              '',
              '### flutter --version',
              '```', clip(read('/tmp/flutter-version.txt'), 1200), '```',
              '',
              '### flutter analyze (exit ' + '${{ steps.analyze.outputs.analyze_exit }}' + ')',
              '```', clip(read('/tmp/analyze.txt'), 6000), '```',
              '',
              '### dart format (exit ' + '${{ steps.format.outputs.format_exit }}' + ')',
              '```', clip(read('/tmp/format.txt'), 4000), '```',
              '',
              '### flutter test (exit ' + '${{ steps.test.outputs.test_exit }}' + ')',
              '```', clip(read('/tmp/test.txt'), 6000), '```',
              '',
              '### deno test (exit ' + '${{ steps.deno.outputs.deno_exit }}' + ')',
              '```', clip(read('/tmp/deno.txt'), 6000), '```',
            ].join('\n');
            await github.rest.issues.createComment({ ...repo, issue_number, body });
